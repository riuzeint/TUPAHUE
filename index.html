<style>
  html{color-scheme:light;font-size:18.5px;overflow-x:hidden}
  body{font-family:'Nunito',sans-serif;background:#f3e8dd;background-image:radial-gradient(#E5C1A1 1.5px,transparent 1.5px);background-size:24px 24px;overflow-x:hidden}

  input,textarea{color:#E5C1A1;-webkit-text-fill-color:#E5C1A1}
  input::placeholder{color:rgba(229,193,161,.45);-webkit-text-fill-color:rgba(229,193,161,.45)}
  .entra{animation:entra .35s cubic-bezier(.16,1,.3,1)}
  @keyframes entra{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .flota{animation:flota 3.5s ease-in-out infinite}@keyframes flota{50%{transform:translateY(-6px)}}
  .late::before{content:'';position:absolute;inset:-6px;border-radius:9999px;background:#D6533F;animation:late 2s infinite;z-index:0}
  @keyframes late{0%{transform:scale(.9);opacity:.85}70%,100%{transform:scale(1.5);opacity:0}}
  .no-scroll::-webkit-scrollbar{display:none}
  canvas.lienzo{touch-action:none;background:#fff;border-radius:18px}
  .holdable{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
</style>
</head>

<script>
/* ==========================================================================

const ROLES = {

// Orden en que se reparten los roles. Con menos de 6 personas, alguien tendrá 2 roles.
const ORDEN_ROLES = ['profeta','navegador','fotografo','agitador','microfono','equilibrista'];

const RUTAS = [
  { id:'taller', nombre:'Taller', etiqueta:'Demo', lugar:'Facultad · demo universitaria', activa:true,
    tiempo:'~30 min', dificultad:4, completada:7,

    cierre:'Llegamos al lugar donde nació este juego. Cada uno tenía una parte: la voz, la brújula, la cámara, el movimiento, el oído y el equilibrio. Ninguna servía sola. Esto que hicimos juntos se llama comunidad.',
    checkpoints:[
      { lugar:'Entrada',        nfc:1, rumbo:0,   mision:'equilibrio', pista:'Empiecen donde todos entran: los torniquetes.' },
      { lugar:'Espacio libre',  nfc:2, rumbo:0,   mision:'colores',    pista:'Frente a la entrada se abre el lugar donde la facultad respira.' },
      { lugar:'Escalera del fondo', nfc:3, rumbo:0, mision:'fotos',    pista:'Al fondo del espacio libre, a mano derecha, hay una forma de subir.' },
      { lugar:'Auditorio (3er piso)', nfc:4, rumbo:180, mision:'sonidos',  pista:'Suban al tercer piso: la puerta alta del lugar donde muchos escuchan a uno solo.' },
      { lugar:'LID',            nfc:5, rumbo:90,  mision:'brujula',    pista:'Frente al auditorio, a mano derecha: el laboratorio donde lo digital se toca.',
        rumboSecreto:90, palabra:'TUPAHUE', pistaProfeta:'En la dirección que apunte el Navegador hay una palabra escondida. Él la verá en su pantalla: pídansela.' },
      { lugar:'Taller de Interacción Digital', nfc:6, rumbo:90, final:true, pista:'Sigan el pasillo hasta el fondo: el lugar donde nació este juego.' },
    ]},
  { id:'cascada', nombre:'La Cascada', etiqueta:'Cerro', lugar:'Cerro San Cristóbal · Santiago', activa:false,
    tiempo:'~90 min', dificultad:6, completada:0,
    bajada:'Acceso Pedro de Valdivia → Mirador Mapulemu → Jardín Mapulemu → La Cascada.' },
];

const MISIONES = {
  // voz = lo que lee el Profeta (corto). Las tareas de cada rol se arman en la sección 5 (prepararMision).
  equilibrio:{ titulo:'Equilibrio en orden', voz:'Cada uno tiene un número secreto. Presionen en orden: 1, 2, 3… El Equilibrista mantiene su celular plano todo el rato.' },
  colores:   { titulo:'Cazadores de color',  voz:'Busquen algo de color {obj}. Cada rol tiene una tarea: ¡miren su celular!' },
  fotos:     { titulo:'Fotografía contra el tiempo', voz:'Encuentren y fotografíen {obj}. ¡El tiempo corre! Agitador y Equilibrista lo frenan.' },
  sonidos:   { titulo:'Colección de sonidos', voz:'Todos juntos: {obj}. Cada rol tiene una tarea mientras suena.' },
  brujula:   { titulo:'Brújula ciega', voz:'La palabra secreta está repartida entre ustedes. Cumplan su tarea, díctenme su pedazo y yo la escribo.' },
};
// Objetos para la IA de fotos. "ia" = nombres que la IA puede devolver para ese objeto (se acepta cualquiera)
const OBJETOS = [
  { ia:['chair','bench','couch'], es:'una silla' }, { ia:['bottle','vase','cup'], es:'una botella' }, { ia:['backpack','handbag','suitcase'], es:'una mochila o bolso' },
  { ia:['book','laptop'], es:'un libro o cuaderno' }, { ia:['laptop','tv','keyboard'], es:'un computador' }, { ia:['cup','wine glass','bottle','bowl'], es:'un vaso o taza' },
  { ia:['potted plant','vase'], es:'una planta' }, { ia:['cell phone','remote'], es:'un celular' }, { ia:['person'], es:'una persona del grupo' },
];
const INTENTOS_FOTO = 2;    // si la IA falla esta cantidad de veces, se regala la foto (para no trabar el juego)
const RUMBOS = [{g:0,es:'NORTE'},{g:90,es:'ESTE'},{g:180,es:'SUR'},{g:270,es:'OESTE'}];
// Insignias por rol (se ganan al terminar la ruta y quedan guardadas en el celular)
const INSIGNIAS = {
  profeta:{ nombre:'Voz del Cerro', icono:'📜' }, navegador:{ nombre:'Brújula Humana', icono:'🧭' }, fotografo:{ nombre:'Ojo de Cóndor', icono:'📷' },
  agitador:{ nombre:'Motor del Grupo', icono:'⚡' }, microfono:{ nombre:'Oído Fino', icono:'🎙️' }, equilibrista:{ nombre:'Pulso Firme', icono:'⚖️' },
};
const TIEMPO_FOTOS = 90;        // segundos de la misión de fotos
// Colores de la misión "Cazadores de color" (h = rangos de tono, 0-360)
const COLORES = [
  { id:'rojo', es:'ROJO', hex:'#D6533F', h:[[0,15],[340,361]] }, { id:'naranjo', es:'NARANJO', hex:'#F28C38', h:[[15,40]] },
  { id:'amarillo', es:'AMARILLO', hex:'#E8C547', h:[[40,68]] },  { id:'verde', es:'VERDE', hex:'#5E9E4A', h:[[68,165]] },
  { id:'azul', es:'AZUL', hex:'#3F6FD6', h:[[185,255]] },       { id:'morado', es:'MORADO', hex:'#863B56', h:[[255,340]] },
];
const PORC_COLOR = 8;       // % mínimo de la foto que debe tener el color
// Sonidos de la misión "Colección de sonidos"
const SONIDOS = ['un aplauso de todos al mismo tiempo','un silbido','una risa grupal','todos diciendo "¡Tupahue!"','golpes en una mesa o pared, al mismo ritmo','un "shhh" muy largo de todos'];
const UMBRAL_SONIDO = 35;   // volumen mínimo (0-100) para que la grabación cuente
const BROKERS = ['wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt'];

/* ==========================================================================
   2. ILUSTRACIONES (avatares de roles y paisajes en SVG)
   ========================================================================== */
const AVATAR = {
  profeta:`<svg viewBox="0 0 64 64" class="w-full h-full"><path d="M8 24 Q20 20 32 26 Q44 20 56 24 V52 Q44 48 32 54 Q20 48 8 52Z" fill="#E5C1A1" stroke="#5B1B3A" stroke-width="2.5" stroke-linejoin="round"/><line x1="32" y1="26" x2="32" y2="54" stroke="#5B1B3A" stroke-width="2.5"/><path d="M14 32 Q22 30 27 33 M14 39 Q22 37 27 40 M37 33 Q42 30 50 32 M37 40 Q42 37 50 39" fill="none" stroke="#87332B" stroke-width="2" stroke-linecap="round"/><path d="M32 3 L34.4 8.6 L40.5 9.1 L35.8 13 L37.3 19 L32 15.8 L26.7 19 L28.2 13 L23.5 9.1 L29.6 8.6Z" fill="#D6533F" stroke="#5B1B3A" stroke-width="1.5" stroke-linejoin="round"/></svg>`,
  navegador:`<svg viewBox="0 0 64 64" class="w-full h-full"><circle cx="32" cy="32" r="24" fill="#E5C1A1" stroke="#5B1B3A" stroke-width="3"/><circle cx="32" cy="32" r="18" fill="none" stroke="#87332B" stroke-width="1.5" stroke-dasharray="2 4"/><path d="M32 8 V13 M32 51 V56 M8 32 H13 M51 32 H56" stroke="#5B1B3A" stroke-width="2.5" stroke-linecap="round"/><polygon points="32,14 38,32 32,28 26,32" fill="#D6533F" stroke="#5B1B3A" stroke-width="1.5" stroke-linejoin="round"/><polygon points="32,50 38,32 32,36 26,32" fill="#5C4E16" stroke="#5B1B3A" stroke-width="1.5" stroke-linejoin="round"/><circle cx="32" cy="32" r="2.5" fill="#5B1B3A"/></svg>`,
  fotografo:`<svg viewBox="0 0 64 64" class="w-full h-full"><rect x="7" y="20" width="50" height="34" rx="6" fill="#863B56" stroke="#5B1B3A" stroke-width="2.5"/><path d="M22 20 L26 12 H38 L42 20Z" fill="#5B1B3A"/><circle cx="32" cy="37" r="11" fill="#E5C1A1" stroke="#5B1B3A" stroke-width="2.5"/><circle cx="32" cy="37" r="5.5" fill="#5B1B3A"/><circle cx="32" cy="37" r="2" fill="#E5C1A1"/><circle cx="49" cy="27" r="2.5" fill="#D6533F"/></svg>`,
  agitador:`<svg viewBox="0 0 64 64" class="w-full h-full"><rect x="20" y="8" width="24" height="48" rx="5" fill="#5B1B3A" stroke="#5B1B3A" stroke-width="2.5"/><rect x="24" y="14" width="16" height="32" rx="2" fill="#E5C1A1"/><polygon points="35,17 27,33 32,33 29,44 38,27 33,27" fill="#D6533F" stroke="#5B1B3A" stroke-width="1.2" stroke-linejoin="round"/><circle cx="32" cy="51" r="2" fill="#E5C1A1"/><path d="M13 22 Q9 32 13 42 M8 17 Q3 32 8 47 M51 22 Q55 32 51 42 M56 17 Q61 32 56 47" fill="none" stroke="#D6533F" stroke-width="2.5" stroke-linecap="round"/></svg>`,
  microfono:`<svg viewBox="0 0 64 64" class="w-full h-full"><rect x="23" y="6" width="18" height="30" rx="9" fill="#87332B" stroke="#5B1B3A" stroke-width="2.5"/><path d="M23 16 H41 M23 22 H41 M23 28 H41" stroke="#E5C1A1" stroke-width="2" opacity=".7"/><path d="M15 28 Q15 46 32 46 Q49 46 49 28" fill="none" stroke="#5B1B3A" stroke-width="3" stroke-linecap="round"/><line x1="32" y1="46" x2="32" y2="56" stroke="#5B1B3A" stroke-width="3"/><line x1="21" y1="57" x2="43" y2="57" stroke="#5B1B3A" stroke-width="3.5" stroke-linecap="round"/></svg>`,
  equilibrista:`<svg viewBox="0 0 64 64" class="w-full h-full"><rect x="5" y="16" width="54" height="18" rx="9" fill="#E5C1A1" stroke="#5B1B3A" stroke-width="2.5"/><line x1="25" y1="19" x2="25" y2="31" stroke="#5B1B3A" stroke-width="2"/><line x1="39" y1="19" x2="39" y2="31" stroke="#5B1B3A" stroke-width="2"/><circle cx="32" cy="25" r="5" fill="#D6533F" stroke="#5B1B3A" stroke-width="1.5"/><polygon points="32,38 22,57 42,57" fill="#5C4E16" stroke="#5B1B3A" stroke-width="2.5" stroke-linejoin="round"/></svg>`,
};
const MONTANAS = `<svg viewBox="0 0 375 330" preserveAspectRatio="none" class="w-full h-full block">
  <path d="M0 175 L55 115 L110 155 L185 88 L255 148 L320 105 L375 150 L375 330 L0 330Z" fill="#863B56" opacity=".45"/>
  <path d="M0 190 L85 130 L165 180 L240 112 L315 168 L375 135 L375 330 L0 330Z" fill="#5B1B3A" opacity=".55"/>
  <path d="M185 88 L162 115 L178 112 L185 122 L195 110 L208 116Z" fill="#E5C1A1" opacity=".85"/>
  <path d="M0 125 Q95 190 165 275 L0 295Z" fill="#84752F"/><path d="M375 170 Q275 215 195 280 L375 300Z" fill="#87332B" opacity=".85"/>
  <path d="M0 250 Q185 215 375 260 L375 330 L0 330Z" fill="#84752F"/><path d="M0 280 Q190 255 375 290 L375 330 L0 330Z" fill="#5C4E16"/>
  <g fill="#5C4E16"><circle cx="52" cy="265" r="14"/><circle cx="70" cy="272" r="11"/><circle cx="322" cy="274" r="15"/></g></svg>`;
const PICO = `<svg viewBox="0 0 375 150" preserveAspectRatio="none" class="absolute inset-0 w-full h-full pointer-events-none">
  <polygon points="25,145 95,55 165,145" fill="#863B56"/><polygon points="215,145 290,52 360,145" fill="#863B56"/>
  <polygon points="85,145 188,8 290,145" fill="#5B1B3A"/><polygon points="188,8 153,55 172,50 188,64 205,48 222,55" fill="#E5C1A1"/></svg>`;
const arbol = (x,y,s=1)=> IMG_OK.arbol ? `<image href="img/arbol.png" x="${x-20*s}" y="${y-26*s}" width="${40*s}" height="${52*s}"/>` : `<g transform="translate(${x},${y}) scale(${s})"><rect x="-3" y="14" width="6" height="10" rx="2" fill="#87332B"/><polygon points="0,-16 -14,6 14,6" fill="#5C4E16"/><polygon points="0,-6 -17,16 17,16" fill="#5C4E16"/></g>`;
// posiciones (%) de los 6 puntos sobre el sendero del mapa
const POS = [[30,88],[60,74],[34,58],[58,42],[40,26],[56,10]];
// Dibujos a mano: si existe img/<nombre>.png se usa; si no, aparece el dibujo por defecto
const IMG_OK = {};
['logo','fondo-inicio','rol-profeta','rol-navegador','rol-fotografo','rol-agitador','rol-microfono','rol-equilibrista','arbol','sello-postal','insignia-profeta','insignia-navegador','insignia-fotografo','insignia-agitador','insignia-microfono','insignia-equilibrista']
  .forEach(n=>{ const i=new Image(); i.onload=()=>{ IMG_OK[n]=true; render(true); }; i.src='img/'+n+'.png'; });
const png = (n,cls='') => `<img src="img/${n}.png" class="${cls}" alt="">`;
const dif = n => Array.from({length:10},(_,i)=>`<span class="inline-block w-2 h-3 rounded-sm mr-0.5 align-middle ${i<n?'bg-poppy':'bg-current opacity-25'}"></span>`).join('')+` <span class="align-middle">${n}/10</span>`;

/* ==========================================================================
   3. MEMORIA LOCAL (perfil solo la primera vez)
   ========================================================================== */
const store = { get(k){ try{ return JSON.parse(localStorage.getItem('tup_'+k)) }catch(e){ return null } },
                set(k,v){ try{ localStorage.setItem('tup_'+k, JSON.stringify(v)) }catch(e){} } };
let perfil = store.get('perfil');
const miId = store.get('id') || ('p'+Math.random().toString(36).slice(2,8)); store.set('id', miId);
const TAB = Math.random().toString(36).slice(2);
const nfcURL = parseInt(new URLSearchParams(location.search).get('nfc')) || null;   // ?nfc=3 al acercar un sticker

/* ==========================================================================
   4. CONEXIÓN ENTRE CELULARES (modelo anfitrión)
   El anfitrión (quien crea la sala = Profeta) guarda el estado y lo reparte.
   Los demás solo envían acciones.
   ========================================================================== */
let net=null, sala=null, soyAnfitrion=false, simulado=false, S=null, vista='bienvenida', ultimoJSON='';
const MEDIA = [];   // fotos, dibujos y audios para la pieza audiovisual (en el anfitrión)

function conectar(codigo, cb){
  // Se conecta a los 2 servidores al mismo tiempo y envía por ambos.
  // Así dos celulares nunca quedan en servidores distintos (eso causaba que no se encontraran).
  red('conectando…'); const topico='tupahue/v5/'+codigo, vistos=new Set(), clis=[]; let fin=false;
  if (typeof mqtt==='undefined'){ red('sin conexión'); return cb(false); }
  BROKERS.forEach(url=>{ const cli=mqtt.connect(url,{ clientId:'tup_'+miId+'_'+Math.random().toString(36).slice(2,6), connectTimeout:8000, reconnectPeriod:2000 });
    clis.push(cli);
    cli.on('connect',()=>{ cli.subscribe(topico); red('en línea · sala '+codigo); if(!fin){ fin=true; clearTimeout(t); cb(true); } });
    cli.on('message',(_,b)=>{ try{ const m=JSON.parse(b.toString()); if(m.mid){ if(vistos.has(m.mid)) return; vistos.add(m.mid); if(vistos.size>800) vistos.clear(); } recibir(m); }catch(e){} });
    cli.on('error',()=>{}); });
  net={ enviar:m=>{ m.mid=Math.random().toString(36).slice(2,10); const txt=JSON.stringify(m); clis.forEach(c=>{ if(c.connected) c.publish(topico,txt); }); } };
  const t=setTimeout(()=>{ if(!fin){ fin=true; red('sin conexión'); clis.forEach(c=>{try{c.end(true)}catch(e){}}); cb(false); } },10000);
}
function enviar(m){ if(!simulado && net) net.enviar(m); }
function recibir(m){ if (typeof pausada!=='undefined' && pausada) return;
  if (m.t==='estado' && !soyAnfitrion){ const j=JSON.stringify(m.s); if(j===ultimoJSON) return; ultimoJSON=j; const a=S; S=m.s; avisos(a,S); render(); }
  if (soyAnfitrion && m.t==='unirse') agregar(m.id, m.nombre);
  if (soyAnfitrion && m.t==='accion') procesar(m.id, m.a);
}
function accion(a){ if (soyAnfitrion) procesar(miId, a); else enviar({ t:'accion', id:miId, a }); }
let tPub=null; function publicar(){ clearTimeout(tPub); tPub=setTimeout(()=>enviar({ t:'estado', s:S }), 120); }
setInterval(()=>{ if(soyAnfitrion && S) enviar({ t:'estado', s:S }); }, 3000);
setInterval(()=>{ if(!soyAnfitrion && sala && perfil && !(S && S.jugadores.some(j=>j.id===miId))) enviar({ t:'unirse', id:miId, nombre:perfil.nombre }); }, 2000);

/* ==========================================================================
   5. LÓGICA DEL JUEGO (solo la ejecuta el anfitrión)
   ========================================================================== */
const ruta = ()=> RUTAS.find(r=>r.id===S.ruta);
const cpAct = ()=> ruta().checkpoints[S.cp];
const mezclar = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const nombre = id => (S.jugadores.find(j=>j.id===id)||{}).nombre || '?';
const quien = rol => S.roles && S.roles[rol];
const misRoles = (id=miId) => S && S.roles ? ORDEN_ROLES.filter(r=>S.roles[r]===id) : [];
const tengo = rol => misRoles().includes(rol);

function nuevaSala(cod){ return { codigo:cod, fase:'lobby', ruta:null, cp:0, jugadores:[{id:miId,nombre:perfil.nombre}],
  roles:null, nfcTurno:null, mision:null, ayuda:false, aviso:null, avisoN:0, celebrar:0,
  stats:{ inicio:null, fin:null, errores:0, ayudas:0, misiones:[], clima:null } }; }
function agregar(id,nom){ if(S.fase!=='lobby' || S.jugadores.length>=6 || S.jugadores.some(j=>j.id===id)) return; S.jugadores.push({id,nombre:nom}); cambio(); }
function aviso(t){ S.aviso=t; S.avisoN=Date.now(); }

function asignarRoles(){
  const otros = mezclar(S.jugadores.slice(1).map(j=>j.id)), lista=[S.jugadores[0].id, ...otros];  // anfitrión = Profeta
  S.roles={}; ORDEN_ROLES.forEach((r,i)=>S.roles[r]=lista[i%lista.length]);
}
function elegirNFC(){ // al azar; si hay 2+ personas, nunca el Profeta (en iPhone el NFC abre otra pestaña)
  S.pase=null;
  const ids=S.jugadores.map(j=>j.id), op = ids.length>1 ? ids.filter(i=>i!==quien('profeta')) : ids;
  S.nfcTurno = op[Math.floor(Math.random()*op.length)];
}
// --- Tareas por rol: cada misión tiene "rondas" y en cada ronda cada rol tiene UNA tarea ---
const rumboAzar = () => RUMBOS[Math.floor(Math.random()*4)];
function tareaRumbo(){ const r=rumboAzar(); return { t:'rumbo', rumbo:r.g, txt:'Apunta al '+r.es+' y mantén 3 segundos' }; }
function prepararMision(cp){
  const ids=S.jugadores.map(j=>j.id), base={ tipo:cp.mision, errores:0, inicio:Date.now(), ronda:0 };
  if (cp.mision==='equilibrio') return { ...base, orden:mezclar(ids), paso:0, nivel:false };

// Reloj de la misión de fotos: corre más rápido si el Agitador para o el Equilibrista se inclina
setInterval(()=>{
  if (!soyAnfitrion || !S || S.fase!=='mision' || S.mision.tipo!=='fotos') return;
  const m=S.mision, activo = Date.now()-m.ultimaEnergia < 2500;
  m.tiempo -= 1 + (activo?0:2) + (m.nivel?0:1); m.energia = Math.max(0, m.energia-12);
  if (m.tiempo<=0){ m.errores++; S.stats.errores++; aviso('¡Se acabó el tiempo! El reloj vuelve a empezar (no pierden lo avanzado).'); m.tiempo=TIEMPO_FOTOS; }
  cambio();
}, 1000);

function procesar(id, a){
  const m=S.mision, cp=S.fase!=='lobby'&&S.ruta?cpAct():null;
  const err = t => { if(m) m.errores++; S.stats.errores++; aviso(t); };
  switch(a.k){
    // --- sala ---
    case 'ruta': if(id===S.jugadores[0].id && RUTAS.find(r=>r.id===a.ruta&&r.activa)) S.ruta=a.ruta; break;
    case 'bot+': if(simulado && S.jugadores.length<6){ const n=['Vale','Tomás','Sofi','Benja','Isi']; const k=S.jugadores.length; S.jugadores.push({id:'bot'+k,nombre:n[k-1]+' (sim)'}); } break;
    case 'bot-': if(simulado && S.jugadores.length>2) S.jugadores.pop(); break;
    case 'comenzar': if(S.ruta && S.jugadores.length>=2){ asignarRoles(); S.fase='roles'; } break;
    // --- roles e historia (solo el Profeta) ---
    case 'rolesListos': if(id===quien('profeta')) S.fase='revelar'; break;
    case 'iniciar': if(id===quien('profeta')){ S.fase='camino'; S.cp=0; S.stats.inicio=Date.now(); elegirNFC(); } break;
    case 'ayuda': S.ayuda=true; S.stats.ayudas++; break;
    // --- COMODÍN del Profeta: cambia al instante quién toca el NFC (si esa persona no puede) ---
    case 'comodin': { if (S.fase!=='camino' || id!==quien('profeta')) return;
      const ids=S.jugadores.map(j=>j.id).filter(i=>i!==S.nfcTurno), sinP=ids.filter(i=>i!==quien('profeta')), op=sinP.length?sinP:ids;
      if (!op.length) return; S.nfcTurno=op[Math.floor(Math.random()*op.length)]; S.pase=null; S.stats.ayudas++;
      aviso('Comodín: ahora el NFC lo toca '+nombre(S.nfcTurno)+'.'); break; }
    // --- pasar el turno del NFC con votación (lo pide quien tiene el turno o el Profeta) ---
    case 'pasarNFC': {
      if (S.fase!=='camino' || (id!==S.nfcTurno && id!==quien('profeta')) || S.pase) return;
      const ids=S.jugadores.map(j=>j.id), actual=S.nfcTurno, otros=ids.filter(i=>i!==actual); if (!otros.length) return;
      const sinProfeta=otros.filter(i=>i!==quien('profeta')), lista=sinProfeta.length?sinProfeta:otros;
      const despues=ids.slice(ids.indexOf(actual)+1).concat(ids.slice(0,ids.indexOf(actual))).find(i=>lista.includes(i)) || lista[0];
      S.pase={ por:id, de:actual, a:despues, ok:[id] };
      aviso(nombre(id)+' pide que el NFC lo toque '+nombre(despues)+'. Aprueben.');
      if (votantes().every(v=>S.pase.ok.includes(v))) aplicarPase(); break; }
    case 'votarPase': {
      if (S.fase!=='camino' || !S.pase || S.pase.ok.includes(id)) return;
      if (!a.ok){ aviso(nombre(id)+' rechazó el cambio de NFC.'); S.pase=null; break; }
      S.pase.ok.push(id); if (votantes().every(v=>S.pase.ok.includes(v))) aplicarPase(); break; }
    case 'cancelarPase': if(S.pase && (id===S.pase.por || id===quien('profeta'))) S.pase=null; break;
    // --- NFC ---
    case 'nfc':
      if (S.fase!=='camino') return;
      if (a.n!==cp.nfc) { aviso('Ese NFC no es el de este punto. Busquen el '+cp.nfc+'.'); break; }
      if (id!==S.nfcTurno) { aviso('¡No! Le toca a '+nombre(S.nfcTurno)+' acercar su celular.'); break; }
      if (a.manual) S.stats.nfcManual=(S.stats.nfcManual||0)+1;
      S.ayuda=false; S.pase=null;
      if (cp.final) S.fase='cierre'; else { S.fase='mision'; S.mision=prepararMision(cp); }
      break;
    // --- misión: equilibrio en orden ---
    case 'nivel': if(!m||!('nivel' in m)||id!==quien('equilibrista')) return;
      if (m.tipo==='equilibrio' && m.nivel && !a.ok && m.paso>0){ m.paso=0; falloRol('equilibrista'); err('¡Se perdió el equilibrio! Vuelvan al 1.'); }
      m.nivel=a.ok; break;
    case 'presionar': if(!m||m.tipo!=='equilibrio') return;
      if (!m.nivel) { m.paso=0; err('El celular del Equilibrista no está plano.'); break; }
      if (m.orden[m.paso]===id){ m.paso++; if(m.paso>=m.orden.length) return completar(); }
      else { m.paso=0; err('¡Alguien se adelantó! Vuelvan al 1.'); }
      break;
    // --- misión de fotos: el Agitador mantiene vivo el reloj ---
    case 'energia': if(m&&m.tipo==='fotos'&&id===quien('agitador')){ m.ultimaEnergia=Date.now(); m.energia=Math.min(100,m.energia+a.c*10); } return;
    // --- TAREAS por rol (todas las misiones nuevas) ---
    case 'tarea': {
      if (!m || !m.rondas) return; const R=m.rondas[m.ronda], T=R&&R.tareas[a.rol];
      if (!T || T.hecho || quien(a.rol)!==id) return;
      if (T.requiere && R.tareas[T.requiere] && !R.tareas[T.requiere].hecho) return;
      if (T.t==='foto'){ if (a.thumb) MEDIA.push({tipo:'img', src:a.thumb, txt:(R.obj?R.obj+' · ':'')+nombre(id)});
        if (!a.ok){ T.intentos=(T.intentos||0)+1; falloRol('fotografo');
          if (T.intentos<INTENTOS_FOTO){ err('La cámara no lo reconoció ('+(a.vio||'?')+'). Intenten otra foto.'); break; }
          aviso('La cámara no lo reconoció, pero les damos esta foto. ✓'); } }
      if (T.t==='grabar' && a.clip) MEDIA.push({tipo:'audio', src:a.clip, txt:R.obj||'sonido'});
      T.hecho=true; okRol(a.rol);
      if (Object.values(R.tareas).every(t=>t.hecho)){
        if (m.tipo==='brujula') break;                       // falta que el Profeta escriba la palabra
        m.ronda++; if (m.ronda>=m.rondas.length) return completar();
        aviso('¡Ronda lista! Siguiente: '+m.rondas[m.ronda].obj);
      }
      break; }
    case 'clave': if(!m||m.tipo!=='brujula'||id!==quien('profeta')) return;
      if (a.w.trim().toUpperCase()===cp.palabra) return completar(); err('"'+a.w.toUpperCase()+'" no es la palabra.');
      break;
    // --- cierre ---
    case 'terminar': if(id===quien('profeta') && S.fase==='cierre'){ S.fase='final'; S.stats.fin=Date.now(); buscarClima(); } break;
  }
  cambio();
}
const votantes = () => S.jugadores.map(j=>j.id).filter(i=>!S.pase || i!==S.pase.de);   // quien no puede tocar el NFC no necesita votar
function rolStat(r){ S.stats.rol=S.stats.rol||{}; return S.stats.rol[r]=S.stats.rol[r]||{ok:0,fallos:0}; }

const B={};
function tras(clave, ms, fn){ const k=clave+'|'+S.cp+'|'+S.fase; if(!B[k]) B[k]=Date.now(); else if(Date.now()-B[k]>=ms && !B[k+'!']){ B[k+'!']=1; fn(); } }
const esBot = id => id && id.startsWith('bot');
setInterval(()=>{
  if (!simulado || !S) return; const m=S.mision, cp=S.fase!=='lobby'&&S.ruta?cpAct():null;
  if (S.fase==='camino' && S.pase){ const b=votantes().find(v=>esBot(v) && !S.pase.ok.includes(v)); if(b) return procesar(b,{k:'votarPase',ok:true}); }

  if (S.fase!=='mision' || !m) return;
  if (m.tipo==='equilibrio'){
    if (esBot(quien('equilibrista')) && !m.nivel) procesar(quien('equilibrista'),{k:'nivel',ok:true});
    const t=m.orden[m.paso]; if (esBot(t) && m.nivel) tras('p'+m.paso+m.errores, 900, ()=>procesar(t,{k:'presionar'}));
  }
  if (m.tipo==='fotos'){ if (esBot(quien('agitador'))) procesar(quien('agitador'),{k:'energia',c:3}); if (esBot(quien('equilibrista')) && !m.nivel) procesar(quien('equilibrista'),{k:'nivel',ok:true}); }
  if (m.rondas){ const R=m.rondas[m.ronda]; if(!R) return;
    Object.entries(R.tareas).forEach(([rol,T])=>{ const b=quien(rol); if(!esBot(b) || T.hecho) return;

}, 1000);
function garabato(){ const c=document.createElement('canvas'); c.width=c.height=240; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,240,240); x.strokeStyle='#5B1B3A'; x.lineWidth=4; x.beginPath(); x.moveTo(40,200); for(let i=0;i<8;i++) x.lineTo(40+i*22, 200-i*20+(i%2)*15); x.stroke(); x.strokeRect(150,40,50,60); return c.toDataURL('image/jpeg',.5); }

let AC=null; function bip(f=880,d=.15){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(), g=AC.createGain(); o.frequency.value=f; g.gain.value=.08; o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+d);}catch(e){} }

const difAng = (a,b)=>{ let d=Math.abs(a-b)%360; return d>180?360-d:d; };

const MONTAJES = {
  // Equilibrista (continuo): burbuja de nivel; avisa al anfitrión cuando cambia

  agitarTarea(el){ const meta=+el.dataset.meta, bar=el.querySelector('[data-barra]'), bt=el.querySelector('[data-tap]'), num=el.querySelector('[data-num]'); let c=0, ult=0, listo=false;

    const h=e=>{ const a=e.accelerationIncludingGravity; if(!a) return; const g=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z); if(Math.abs(g-9.8)>6 && Date.now()-ult>150){ ult=Date.now(); sumar(); } };

  },
  // TAREA Equilibrista: celular plano 3 segundos seguidos
  nivelTarea(el){ const bur=el.querySelector('[data-burbuja]'), bar=el.querySelector('[data-barra]'), hold=el.querySelector('[data-hold]'); let plano=false, viaSensor=false, acum=0, listo=false;
    escucharOrientacion(e=>{ if(e.beta==null) return; viaSensor=true; const x=Math.max(-40,Math.min(40,e.gamma||0)), y=Math.max(-40,Math.min(40,e.beta||0)); bur.style.transform=`translate(${x*1.5}px,${y*1.5}px)`; plano=Math.abs(x)<8&&Math.abs(y)<8; });

      try{ if(!stream){ stream=await navigator.mediaDevices.getUserMedia({audio:true}); ac=new (window.AudioContext||window.webkitAudioContext)(); an=ac.createAnalyser(); an.fftSize=512; buf=new Uint8Array(an.fftSize); ac.createMediaStreamSource(stream).connect(an); alLimpiar(()=>{ stream.getTracks().forEach(t=>t.stop()); ac.close(); }); } }
      catch(e){ est.textContent='Sin micrófono: la tarea se marca igual.'; setTimeout(()=>accion({k:'tarea',rol:'microfono',clip:null}),1200); return; }
      let max=0, partes=[], rec=null; try{ rec=new MediaRecorder(stream,{audioBitsPerSecond:24000}); rec.ondataavailable=e=>partes.push(e.data); rec.start(); }catch(e){}
      const t0=Date.now(); est.textContent='Grabando… ¡ahora!';
      const iv=setInterval(()=>{ const v=medir(); max=Math.max(max,v); if(barra) barra.style.width=v+'%'; b.textContent='● '+Math.max(0,3-Math.floor((Date.now()-t0)/1000))+' s';
        if (Date.now()-t0<3000) return; clearInterval(iv);
        const fin=clip=>{ b.disabled=false; b.textContent='● Grabar 3 segundos';
          if (max<UMBRAL_SONIDO){ est.textContent='Muy bajo. ¡Más fuerte y repitan!'; return; }
          est.textContent='¡Grabado! ✓'; accion({k:'tarea',rol:'microfono',clip}); };
        if (rec){ rec.onstop=()=>{ const bl=new Blob(partes,{type:rec.mimeType}); if(bl.size>150000) return fin(null); const fr=new FileReader(); fr.onload=()=>fin(fr.result); fr.readAsDataURL(bl); }; rec.stop(); } else fin(null);
      },100); alLimpiar(()=>clearInterval(iv));
    };
  },
  // Navegador: brújula hacia un rumbo (en el camino solo orienta; en una tarea, 3 s apuntando la cumple)
  brujula(el){ const meta=parseFloat(el.dataset.rumbo), mision=el.dataset.mision==='1'; let rumbo=0, viaSensor=false, acum=0, latido=0;
    escucharOrientacion(e=>{ const r=rumboDe(e); if(r!=null){ viaSensor=true; rumbo=r; } });
    const sl=$('rumbo-slider'); if(sl) sl.addEventListener('input',()=>{ if(!viaSensor) rumbo=parseFloat(sl.value); });
    const iv=setInterval(()=>{ const flecha=$('flecha'); if(flecha) flecha.style.transform=`rotate(${meta-rumbo}deg)`;
      const d=difAng(meta,rumbo), cerca=d<15, txt=$('rumbo-txt'); if(txt) txt.textContent = cerca?'¡Es por aquí! Mantén…':(Math.round(d)+'° de diferencia');
      const anillo=$('anillo'); if(anillo) anillo.classList.toggle('late',cerca);
      if (cerca && Date.now()-latido>900){ latido=Date.now(); bip(1200,.06); vibrar(60); }
      if (mision){ acum = cerca ? acum+0.1 : 0; if(acum>=3){ acum=-999; accion({k:'tarea',rol:'navegador'}); } }
    },100); alLimpiar(()=>clearInterval(iv));
  },
};

// Cámara + IA de objetos (COCO-SSD, corre en el mismo celular)
let modeloIA=null, cargandoIA=null;
function cargarIA(){ if(cargandoIA) return cargandoIA;
  cargandoIA = new Promise(res=>{ const s1=document.createElement('script'); s1.src='https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js';
    s1.onload=()=>{ const s2=document.createElement('script'); s2.src='https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js';
      s2.onload=()=>cocoSsd.load().then(m=>{modeloIA=m;res(m)}).catch(()=>res(null)); s2.onerror=()=>res(null); document.head.appendChild(s2); };
    s1.onerror=()=>res(null); document.head.appendChild(s1); }); return cargandoIA; }
// Foto de una tarea: detecta color, objeto (IA) o acepta cualquier foto ("libre")
function tomarFotoTarea(inp){ const f=inp.files[0]; if(!f) return; const m=S.mision, T=m.rondas[m.ronda].tareas.fotografo, st=$('foto-estado'); st.textContent='Revisando la foto…';
  const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=async()=>{
    const c=document.createElement('canvas'), W=320, H=Math.round(320*img.height/img.width); c.width=W; c.height=H; const x=c.getContext('2d'); x.drawImage(img,0,0,W,H);
    let ok=true, vio='';
    if (T.modo==='color'){ const d=x.getImageData(0,0,W,H).data, cuenta={}; let total=0;
      for(let i=0;i<d.length;i+=16){ const [hh,s,l]=hsl(d[i],d[i+1],d[i+2]); total++; if(s<.3||l<.15||l>.88) continue; const col=COLORES.find(k=>k.h.some(([a,b])=>hh>=a&&hh<b)); if(col) cuenta[col.id]=(cuenta[col.id]||0)+1; }
      const pct=(cuenta[T.color]||0)/Math.max(1,total)*100, top=Object.entries(cuenta).sort((a,b)=>b[1]-a[1])[0];
      vio = top?COLORES.find(k=>k.id===top[0]).es.toLowerCase():'sin color claro'; ok = pct>=PORC_COLOR || !!(top && top[0]===T.color); }
    if (T.modo==='objeto'){ const mo=await Promise.race([cargarIA(), new Promise(r=>setTimeout(()=>r(null),12000))]);
      if (mo){ let et=[]; try{ et=(await mo.detect(c,10,0.2)).map(p=>p.class); }catch(e){} vio=et.join(', ')||'nada'; ok=et.some(e=>T.ia.includes(e)); } }   // si la IA no carga, se acepta
    st.textContent = ok ? '¡Reconocida! ✓' : 'No se reconoció ('+vio+')';
    accion({k:'tarea', rol:'fotografo', thumb:c.toDataURL('image/jpeg',.55), ok, vio}); };
    img.src=r.result; }; r.readAsDataURL(f); inp.value=''; }
function hsl(r,g,b){ r/=255; g/=255; b/=255; const mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2; if(mx===mn) return [0,0,l];
  const d=mx-mn, s=l>.5?d/(2-mx-mn):d/(mx+mn); const h = mx===r?(g-b)/d+(g<b?6:0) : mx===g?(b-r)/d+2 : (r-g)/d+4; return [h*60,s,l]; }
// NFC dentro de la página (Chrome en Android). Mientras está activo, Android NO abre pestañas nuevas:
// la lectura llega directo al juego. Se activa una vez (con "Activar sensores") y queda encendido.
let nfcActivo=false;
async function leerNFC(silencioso){ if(!('NDEFReader' in window) || nfcActivo) return;
  try{ const r=new NDEFReader(); await r.scan(); nfcActivo=true; if(!silencioso) toast('NFC activado: cuando te toque, solo acerca el celular al sticker.');
    r.onreading=e=>{ let n=null; for(const rec of e.message.records){ try{ n=n||parseInt(((new TextDecoder().decode(rec.data)).match(/nfc=(\d+)/)||[])[1]); }catch(x){} }
      if(!n) return toast('Ese sticker no es de Tupahue.','error');
      if(S && S.fase==='camino') accion({k:'nfc',n}); else toast('Todavía no es momento de tocar un NFC.','error'); };
    render(true);
  }catch(e){ if(!silencioso) toast('No se pudo activar el NFC: '+e.message,'error'); } }
function grabar(stream){ try{ const rec=new MediaRecorder(stream,{audioBitsPerSecond:24000}), partes=[];
  rec.ondataavailable=e=>partes.push(e.data); rec.onstop=()=>{ const b=new Blob(partes,{type:rec.mimeType}); if(b.size>150000) return; const fr=new FileReader(); fr.onload=()=>accion({k:'audio',clip:fr.result}); fr.readAsDataURL(b); };
  rec.start(); setTimeout(()=>rec.state!=='inactive'&&rec.stop(), 5000); }catch(e){} }

function widgetBrujula(rumbo, mision){ return `<div data-montar="brujula" data-rumbo="${rumbo}" data-mision="${mision?1:0}" class="text-center">
  <div id="anillo" class="relative mx-auto w-40 h-40 rounded-full bg-elderberry border-4 border-whitesand flex items-center justify-center">
    <svg id="flecha" viewBox="0 0 100 100" class="relative z-10 w-28 h-28 transition-transform duration-100"><polygon points="50,6 64,58 50,48 36,58" fill="#D6533F"/><polygon points="50,94 64,58 50,66 36,58" fill="#E5C1A1"/></svg></div>
  <p id="rumbo-txt" class="mt-2 text-sm font-bold text-whitesand">gira el celular</p>
  <input id="rumbo-slider" type="range" min="0" max="359" value="0" class="w-full mt-2 accent-[#D6533F]"><p class="text-xs text-whitesand/70">Si tu celular no tiene brújula, gira con la barra.</p></div>`; }

// Cambiar de persona en el NFC: quien lo pide + aprobación de todos los jugadores
// Recuadro de alto contraste para lo que el Profeta debe leer en voz alta
const vozAlta=(txt,extra='')=>`<div class="mt-3 rounded-[26px] bg-whitesand text-elderberry p-5 shadow-xl border-4 border-poppy"><p class="text-sm font-extrabold uppercase tracking-widest text-poppy">📢 Lee en voz alta</p><div class="flex items-center gap-3 mt-1">${extra}<p class="text-2xl font-bold leading-snug">${txt}</p></div></div>`;
const escucha=(t='Escucha al Profeta')=>`<div class="text-center">${avatar('profeta','w-24 h-24 mx-auto')}<h1 class="text-4xl font-bold mt-4">${t}</h1><p class="mt-2 text-lg"><b>${esc(nombre(quien('profeta')))}</b> les va a contar.</p></div>`;

function pRoles(){ const prof=quien('profeta')===miId;
  if (!prof) return `<div class="entra min-h-[100dvh] bg-grass px-6 flex flex-col justify-center text-whitesand">${escucha()}<p class="text-center mt-3 text-lg">Cuando termine, verás tu rol aquí.</p></div>`;

    <div class="flex-1 min-w-0"><p class="text-lg font-bold text-whitesand leading-tight">${esc(nombre(S.roles[r]))}</p><p class="font-brand text-xl font-semibold text-poppy leading-tight">es ${ROLES[r].nombre}</p></div></div>`).join('')}</div>
  <div class="mt-5">${btn('Ya les dije sus roles ✓',"accion({k:'rolesListos'})",'bg-elderberry')}</div></div>`; }

function pRevelar(){ const mis=misRoles(), prof=tengo('profeta');
  return `<div class="entra min-h-[100dvh] bg-grass px-5 py-10 flex flex-col justify-center text-whitesand"><p class="text-center text-sm font-extrabold uppercase tracking-widest">${mis.length>1?'Tus roles':'Tu rol'}</p>
  ${mis.map(r=>`<div class="mt-3 p-4 rounded-[26px] bg-poppy border-4 border-whitesand flex items-center gap-3 shadow-lg">${avatar(r,'w-20 h-20')}<div><h2 class="text-3xl font-bold leading-none">${ROLES[r].nombre}</h2><p class="text-base mt-1 leading-snug">${ROLES[r].desc}</p></div></div>`).join('')}
  ${!sensoresOK?`<div class="mt-5">${btn('Activar sensores del celular','pedirSensores()','bg-elderberry')}<p class="text-sm text-center mt-1">Brújula, movimiento y (en Android) NFC.</p></div>`:''}
  ${prof?`${vozAlta(ruta().intro)}<div class="mt-4">${btn('Comenzar el recorrido →',"accion({k:'iniciar'})")}</div>`:`<p class="mt-8 text-center text-2xl font-bold">Escucha al Profeta: va a contar la historia.</p>`}</div>`; }

// Cambiar de persona en el NFC (votación). Quien no puede tocarlo no necesita votar.
function panelPase(meToca,prof){ const p=S.pase;
  if (!p) return meToca?`<button onclick="accion({k:'pasarNFC'})" class="mt-2 w-full py-2.5 rounded-xl bg-elderberry text-whitesand text-sm font-bold">No puedo tocarlo · pedir pasarlo a otra persona</button>`:'';
  const yaVote=p.ok.includes(miId), vot=votantes(), soyVotante=vot.includes(miId);
  return `<div class="mt-2 rounded-xl bg-elderberry p-3"><p class="text-xs font-bold uppercase text-poppy">Cambio de NFC</p>
    <p class="text-base mt-1"><b>${esc(nombre(p.por))}</b> propone que lo toque <b>${esc(nombre(p.a))}</b> en vez de ${esc(nombre(p.de))}.</p>
    <p class="text-xs mt-1 text-whitesand/80">Aprobaron ${p.ok.filter(i=>vot.includes(i)).length} de ${vot.length}</p>
    ${!soyVotante||yaVote?'<p class="text-sm mt-2 font-bold">Esperando a los demás…</p>'
      :`<div class="flex gap-2 mt-2"><button onclick="accion({k:'votarPase',ok:true})" class="flex-1 py-3 rounded-xl bg-poppy font-bold">Aprobar</button><button onclick="accion({k:'votarPase',ok:false})" class="flex-1 py-3 rounded-xl bg-whitesand/15 font-bold">Rechazar</button></div>`}
    ${(miId===p.por||prof)?`<button onclick="accion({k:'cancelarPase'})" class="mt-2 w-full py-2 rounded-xl bg-whitesand/15 text-xs font-bold">Cancelar</button>`:''}</div>`; }

function pCamino(){ const cp=cpAct(), prof=tengo('profeta'), nav=tengo('navegador'), meToca=S.nfcTurno===miId;
  const nfcBox = meToca
    ? `<div class="rounded-[22px] p-4 bg-poppy border-4 border-whitesand"><p class="text-2xl font-bold leading-tight">¡Te toca a ti! Acerca tu celular al NFC ${cp.nfc}</p>

        <button onclick="accion({k:'nfc',n:${cp.nfc},manual:true})" class="mt-2 w-full py-2.5 rounded-xl bg-elderberry/60 text-sm font-bold">El sticker no respondió · ya lo toqué</button>${panelPase(true,prof)}</div>`
    : `<div class="rounded-[22px] p-4 bg-wine"><p class="text-sm font-bold uppercase text-whitesand/80">El NFC lo toca</p><p class="text-3xl font-bold">${esc(nombre(S.nfcTurno))}</p>${panelPase(false,prof)}</div>`;
  return `<div class="entra min-h-[100dvh] bg-grass pb-10">
  <div class="px-4 pt-3 flex justify-between items-center"><span class="px-3 py-1 rounded-full bg-ashwagandha text-whitesand text-sm font-bold">${chipRoles(miId)}</span>
    <span class="px-3 py-1 rounded-full bg-elderberry text-whitesand text-sm font-bold">Punto ${S.cp+1}/${ruta().checkpoints.length}</span></div>
  ${mapaSVG()}
  <div class="mx-4 -mt-2 space-y-3 text-whitesand">
    ${prof?vozAlta(cp.pista):`<div class="rounded-[22px] p-4 bg-ashwagandha"><p class="text-2xl font-bold">Sigan al Profeta</p><p class="text-base">${esc(nombre(quien('profeta')))} tiene la pista.</p></div>`}
    ${nav?`<div class="bg-ashwagandha rounded-[22px] p-4"><p class="text-sm font-extrabold uppercase text-poppy mb-1">Tu brújula · dirección general</p>${widgetBrujula(cp.rumbo,false)}</div>`:''}
    ${nfcBox}
    ${prof?`<details class="bg-ashwagandha rounded-[22px] p-4"><summary class="text-lg font-bold cursor-pointer">¿Necesitan ayuda?</summary>
      ${S.ayuda?`<p class="mt-2 text-lg">El lugar es: <b>${cp.lugar}</b></p>`:`<button onclick="accion({k:'ayuda'})" class="mt-3 w-full py-3 rounded-xl bg-whitesand/15 font-bold">Revelar el lugar</button>`}
      <button onclick="accion({k:'comodin'})" class="mt-2 w-full py-3 rounded-xl bg-poppy font-bold">Comodín: que otra persona toque el NFC</button>
      <p class="text-xs mt-1 text-whitesand/80">Úsenlo si a ${esc(nombre(S.nfcTurno))} se le cerró la página o no le funciona el celular.</p></details>`:''}
  </div></div>`; }

// --- Misiones ---
const cajaNivel=t=>caja(t, `<div data-montar="nivel" class="text-center"><div class="relative mx-auto w-40 h-40 rounded-full bg-elderberry border-4 border-whitesand overflow-hidden"><div class="absolute inset-[45%] rounded-full border-2 border-whitesand/50"></div><div id="burbuja" class="absolute left-1/2 top-1/2 -ml-5 -mt-5 w-10 h-10 rounded-full bg-poppy transition-transform"></div></div>
      <p id="nivel-txt" class="mt-2 text-lg font-bold">Inclinado ✗</p><button id="nivel-hold" class="holdable mt-2 w-full py-3 rounded-xl bg-whitesand/15 text-sm font-bold">Sin giroscopio: mantén presionado</button></div>`);
const caja=(titulo,html)=>`<div class="mt-3 bg-ashwagandha rounded-[24px] p-4 text-whitesand"><p class="text-sm font-extrabold uppercase tracking-wider text-poppy mb-2">${titulo}</p>${html}</div>`;
const cajaRol=(r,txt,w)=>`<div class="mt-3 bg-ashwagandha rounded-[24px] p-4 text-whitesand"><div class="flex items-center gap-3">${avatar(r,'w-12 h-12')}<div><p class="text-xs font-extrabold uppercase tracking-wider text-poppy">Tu tarea · ${ROLES[r].nombre}</p><p class="text-xl font-bold leading-snug">${txt}</p></div></div><div class="mt-3">${w}</div></div>`;
function widgetTarea(r,T,R){
  if (T.hecho) return `<p class="text-2xl font-bold">✓ ¡Listo!</p>${T.frag?`<div class="mt-2 rounded-2xl bg-whitesand text-elderberry p-3 text-center"><p class="text-sm font-bold">Tu pedazo (${T.num} de ${T.de}) · díctaselo al Profeta</p><p class="font-brand text-5xl font-bold tracking-widest">${T.frag}</p></div>`:''}`;
  if (T.t==='agitar') return `<div data-montar="agitarTarea" data-meta="${T.meta}"><div class="h-4 rounded-full bg-elderberry/70 overflow-hidden"><div data-barra class="h-full bg-poppy" style="width:0"></div></div><p data-num class="text-center font-bold mt-1">0 / ${T.meta}</p><button data-tap class="holdable mt-2 w-full py-10 rounded-2xl bg-poppy font-brand text-3xl font-semibold transition">¡Agita o toca!</button></div>`;
  if (T.t==='nivel') return `<div data-montar="nivelTarea" class="text-center"><div class="relative mx-auto w-36 h-36 rounded-full bg-elderberry border-4 border-whitesand overflow-hidden"><div class="absolute inset-[45%] rounded-full border-2 border-whitesand/50"></div><div data-burbuja class="absolute left-1/2 top-1/2 -ml-5 -mt-5 w-10 h-10 rounded-full bg-poppy transition-transform"></div></div>
    <div class="h-3 mt-3 rounded-full bg-elderberry/70 overflow-hidden"><div data-barra class="h-full bg-whitesand" style="width:0"></div></div><button data-hold class="holdable mt-2 w-full py-3 rounded-xl bg-whitesand/15 text-sm font-bold">Sin giroscopio: mantén presionado</button></div>`;
  if (T.t==='rumbo') return widgetBrujula(T.rumbo,true);
  if (T.t==='grabar') return `<div data-montar="grabadora"><div class="relative h-4 rounded-full bg-elderberry/70 overflow-hidden"><div id="t-vol" class="h-full bg-whitesand transition-all"></div><div class="absolute top-0 bottom-0 w-1 bg-poppy" style="left:${UMBRAL_SONIDO}%"></div></div><p class="text-sm mt-1">Tiene que pasar la línea roja.</p><button id="grabar" class="mt-2 w-full py-7 rounded-2xl bg-poppy font-brand text-3xl font-semibold">● Grabar 3 segundos</button><p id="mic-estado" class="text-base font-bold mt-2"></p></div>`;
  if (T.t==='foto'){ const q=T.requiere&&R.tareas[T.requiere]; if (q && !q.hecho) return `<p class="text-lg font-bold">Espera… el ${ROLES[T.requiere].nombre} está cargando el flash ⚡</p>`;
    return `<label class="block w-full py-7 rounded-2xl bg-poppy text-center font-brand text-3xl font-semibold">📷 Tomar foto<input type="file" accept="image/*" capture="environment" class="hidden" onchange="tomarFotoTarea(this)"></label><p id="foto-estado" class="text-base font-bold mt-2">${T.intentos?'Intento '+(T.intentos+1)+' de '+INTENTOS_FOTO:''}</p>`; }
  return '';
}
// Lista del equipo: quién ya cumplió su tarea en esta ronda
function checklist(){ const m=S.mision; if(!m||!m.rondas||!m.rondas[m.ronda]) return ''; const R=m.rondas[m.ronda];
  return `<div class="flex flex-wrap gap-2">${Object.entries(R.tareas).map(([r,T])=>`<span class="px-3 py-1.5 rounded-full text-sm font-bold ${T.hecho?'bg-whitesand text-elderberry':'bg-elderberry text-whitesand/80'}">${T.hecho?'✓':'…'} ${ROLES[r].nombre} · ${esc(nombre(quien(r)))}</span>`).join('')}</div>`; }

function pMision(){ const m=S.mision, cp=cpAct(), M=MISIONES[m.tipo], R=m.rondas?m.rondas[m.ronda]:null; let h='';
  const muestra = m.tipo==='colores'&&R ? `<span class="w-14 h-14 rounded-2xl border-4 border-elderberry shrink-0" style="background:${R.hex}"></span>` : '';
  if (tengo('profeta')) h+=vozAlta(M.voz.replace('{obj}', R?R.obj:''), muestra);
  if (m.tipo==='equilibrio'){
    if (tengo('equilibrista')) h+=cajaNivel('Tu tarea · Equilibrista: celular plano todo el rato');
    h+=caja('Tu número', `<div class="text-center"><p class="font-brand text-7xl font-bold">${m.orden.indexOf(miId)+1}</p><p class="text-base mt-1">Van en el <b id="t-paso">${m.paso}</b> de ${m.orden.length} · <span id="t-nivel"></span></p>
      <button onclick="accion({k:'presionar'})" class="mt-3 w-full py-8 rounded-2xl bg-poppy font-brand text-3xl font-semibold active:scale-95">Presionar</button></div>`);
  }
  if (m.tipo==='fotos'){
    h+=`<div class="mt-3"><div class="flex justify-between text-lg font-bold text-whitesand"><span>⏱ Tiempo</span><span id="t-tiempo">${m.tiempo} s</span></div><div class="h-4 rounded-full bg-elderberry/70 overflow-hidden"><div id="t-barra" class="h-full bg-poppy transition-all"></div></div></div>`;
    if (tengo('agitador')) h+=caja('Tu tarea · Agitador: ¡no pares!', `<div data-montar="agitar"><div class="h-3 rounded-full bg-elderberry/70 overflow-hidden"><div id="t-energia" class="h-full bg-whitesand"></div></div><button id="tap" class="holdable mt-3 w-full py-10 rounded-2xl bg-poppy font-brand text-3xl font-semibold transition">¡Toca y agita!</button><p class="text-sm mt-1">Si paras, el tiempo corre el triple.</p></div>`);
    if (tengo('equilibrista')) h+=cajaNivel('Tu tarea · Equilibrista: plano = el tiempo va más lento');
  }
  if (R) misRoles().forEach(r=>{ const T=R.tareas[r]; if(T) h+=cajaRol(r,T.txt,widgetTarea(r,T,R)); });
  if (m.tipo==='brujula' && tengo('profeta')) h+=caja('Escribe la palabra completa', `<input id="clave" placeholder="palabra" class="w-full px-4 py-4 rounded-2xl bg-elderberry/60 border border-whitesand/25 uppercase text-2xl font-bold outline-none"><div class="mt-2">${btn('Comprobar',"accion({k:'clave',w:$('clave').value})")}</div>`);
  if (R) h+=`<div class="mt-4"><p class="text-sm font-bold text-whitesand/85 mb-2">${m.rondas.length>1?'Ronda '+(m.ronda+1)+' de '+m.rondas.length+' · ':''}Equipo</p><div id="t-check">${checklist()}</div></div>`;
  return `<div class="entra min-h-[100dvh] bg-elderberry px-5 pt-4 pb-12 flex flex-col"><div class="my-auto w-full">
    <div class="flex justify-between items-center"><span class="px-3 py-1 rounded-full bg-wine text-whitesand text-sm font-bold">Punto ${S.cp+1} · ${cp.lugar}</span></div>
    <h1 class="text-3xl font-bold text-whitesand mt-2">${M.titulo}</h1>${h}</div></div>`; }

function pCierre(){ return tengo('profeta')
  ? `<div class="entra min-h-[100dvh] bg-elderberry px-5 flex flex-col justify-center">${vozAlta(ruta().cierre)}<div class="mt-5">${btn('Terminar la ruta ✓',"accion({k:'terminar'})")}</div></div>`
  : `<div class="entra min-h-[100dvh] bg-elderberry px-6 flex flex-col justify-center text-whitesand">${escucha('¡Llegaron!')}</div>`; }

// --- Insignias ---
const nivelIns = r => { const f=((S.stats.rol||{})[r]||{}).fallos||0; return f===0?'Oro':f<=2?'Plata':'Bronce'; };
const chipIns = (r,niv,cls='') => `<div class="flex items-center gap-3 rounded-2xl bg-elderberry/70 p-3 ${cls}"><div class="w-14 h-14 rounded-full bg-whitesand flex items-center justify-center text-3xl shrink-0 border-4 ${niv==='Oro'?'border-[#E8C547]':niv==='Plata'?'border-[#C9C9C9]':'border-[#B87333]'}">${IMG_OK['insignia-'+r]?png('insignia-'+r,'w-full h-full object-contain rounded-full'):INSIGNIAS[r].icono}</div><div class="text-left"><p class="font-brand text-xl font-bold leading-tight">${INSIGNIAS[r].nombre}</p><p class="text-sm">${ROLES[r].nombre} · nivel ${niv}</p></div></div>`;
function guardarInsignias(){ if(!S||S.fase!=='final') return; const clv='ins_'+S.codigo+'_'+S.stats.fin; if(store.get(clv)) return; store.set(clv,1);
  const lista=store.get('insignias')||[]; misRoles().forEach(r=>lista.push({ rol:r, nivel:nivelIns(r), ruta:ruta().nombre, fecha:Date.now() })); store.set('insignias',lista); }

function pFinal(){ guardarInsignias(); const st=S.stats, min=Math.max(1,Math.round((st.fin-st.inicio)/60000)), d=new Date(st.fin), fila=(a,b)=>`<div class="flex justify-between text-base py-1.5 border-b border-whitesand/10"><span class="text-whitesand/85">${a}</span><b>${b}</b></div>`;
  return `<div class="entra min-h-[100dvh] bg-elderberry px-5 pt-6 pb-12 text-whitesand">
  <h1 class="text-4xl font-bold text-center">¡Ruta completada!</h1><p class="text-center text-lg">${ruta().nombre} · ${S.jugadores.length} personas · ${min} min</p>
  <div class="mt-5 rounded-[32px] bg-gradient-to-br from-poppy to-wine p-6 text-center shadow-2xl border-4 border-whitesand">
    <p class="text-sm font-extrabold uppercase tracking-widest">Su recuerdo</p><h2 class="text-3xl font-bold mt-1">Pieza audiovisual</h2>
    ${soyAnfitrion?`<button onclick="verPieza()" class="flota mt-4 w-full py-8 rounded-[26px] bg-whitesand text-elderberry font-brand text-3xl font-bold shadow-xl">▶ Ver nuestra pieza</button><p class="mt-2 text-base">${MEDIA.length} fotos y audios del recorrido</p>`
      :`<p class="mt-3 text-xl font-bold">Júntense alrededor del celular de ${esc(nombre(quien('profeta')))}: ahí se reproduce.</p>`}</div>
  <h2 class="text-2xl font-bold mt-6">${misRoles().length>1?'Tus insignias':'Tu insignia'}</h2>${misRoles().map(r=>chipIns(r,nivelIns(r),'mt-2')).join('')}
  <p class="text-sm mt-1 text-whitesand/80">Quedó guardada en tu perfil.</p>
  <h2 class="text-xl font-bold mt-6">Equipo</h2><div class="mt-1">${S.jugadores.map(j=>fila(esc(j.nombre), misRoles(j.id).map(r=>INSIGNIAS[r].icono+' '+ROLES[r].nombre).join(' · '))).join('')}</div>
  <h2 class="text-xl font-bold mt-6">Estadísticas</h2><div class="mt-1">${fila('Errores',st.errores)}${fila('Ayudas y comodines',st.ayudas)}${fila('Día',d.toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'}))}${fila('Hora',d.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}))}${fila('Clima',st.clima||'—')}
    ${st.misiones.map(x=>fila(MISIONES[x.tipo].titulo, Math.round(x.seg/60*10)/10+' min · '+x.errores+' err.')).join('')}</div>
  <button onclick="salirSala()" class="mt-6 w-full py-3 rounded-2xl bg-ashwagandha text-base font-bold">Volver al inicio</button></div>`; }

// Pantalla cuando se abre un NFC en un navegador sin sesión del juego
function pNfcSin(){ return `<div class="entra min-h-[100dvh] bg-grass px-6 flex flex-col justify-center text-whitesand text-center">
  <h1 class="text-3xl font-bold">¿Estás jugando Tupahue?</h1>
  <p class="mt-3 text-lg">Este NFC se abrió en un navegador donde no está tu partida. <b>Vuelve a la pestaña o app donde estás jugando</b> y presiona <b>"El sticker no respondió · ya lo toqué"</b>.</p>
  <div class="mt-6">${btn('Soy nuevo · quiero jugar',"vista='bienvenida';render()",'bg-elderberry')}</div></div>`; }
function misInsignias(){ const l=store.get('insignias')||[]; if(!l.length) return ''; const c={}; l.forEach(x=>c[x.rol]=(c[x.rol]||0)+1);
  return `<div class="mt-5 px-5"><h2 class="font-bold uppercase tracking-wider text-whitesand mb-2">Mis insignias (${l.length})</h2><div class="flex flex-wrap gap-2">${Object.entries(c).map(([r,n])=>`<span class="px-3 py-2 rounded-2xl bg-ashwagandha text-whitesand font-bold">${INSIGNIAS[r].icono} ${INSIGNIAS[r].nombre} ×${n}</span>`).join('')}</div></div>`; }
/* Pieza audiovisual: presentación con los dibujos, fotos y audios del recorrido */
function verPieza(){ const imgs=MEDIA.filter(x=>x.tipo==='img'), auds=MEDIA.filter(x=>x.tipo==='audio');
  const ov=document.createElement('div'); ov.className='fixed inset-0 z-50 bg-elderberry flex flex-col items-center justify-center text-whitesand p-6 text-center'; document.body.appendChild(ov);
  const diapos=[{t:'Tupahue',s:ruta().nombre+' · '+new Date().toLocaleDateString('es-CL')}, ...imgs.map(i=>({img:i.src,s:i.txt})), {t:'Juntos',s:S.jugadores.map(j=>j.nombre).join(' · ')}];
  let i=0, a=0; const audio=new Audio(); const sig=()=>{ if(a<auds.length){ audio.src=auds[a++].src; audio.play().catch(()=>{}); } }; audio.onended=sig; sig();
  const paso=()=>{ if(i>=diapos.length){ ov.remove(); audio.pause(); return; } const d=diapos[i++];
    ov.innerHTML = d.img ? `<img src="${d.img}" class="max-h-[65vh] rounded-3xl shadow-2xl entra"><p class="mt-3 font-bold">${esc(d.s)}</p>` : `<h1 class="text-5xl font-bold entra">${d.t}</h1><p class="mt-2">${esc(d.s)}</p>`;
    ov.insertAdjacentHTML('beforeend','<p class="absolute bottom-6 text-xs opacity-60">toca para cerrar</p>'); setTimeout(paso, 2600); };
  ov.onclick=()=>{ i=diapos.length; }; paso(); }

/* ==========================================================================
   10. BOTONES DE INICIO Y SALAS
   ========================================================================== */
function registrar(){ const n=$('r-n').value.trim(), c=$('r-c').value.trim();
  if(!n||!c.includes('@')||!$('r-e').checked) return toast('Completa nombre, un correo válido y confirma que eres mayor de edad.','error');
  perfil={nombre:n,correo:c}; store.set('perfil',perfil); vista='inicio'; render(); }
function salirPerfil(){ perfil=null; store.set('perfil',null); vista='registro'; render(); }
const codigoAzar=()=>Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random()*24)]).join('');
function crearSala(sim){ const cod=codigoAzar(); soyAnfitrion=true; sala=cod;
  const iniciar=()=>{ S=nuevaSala(cod); store.set('sala',{cod,host:true,t:Date.now()}); prev=JSON.parse(JSON.stringify(S)); render(); };
  if (sim){ simulado=true; red('modo simulado'); iniciar(); procesar(miId,{k:'bot+'}); procesar(miId,{k:'bot+'}); return; }
  conectar(cod, ok=>{ if(ok) iniciar(); else { soyAnfitrion=false; sala=null; toast('No se pudo conectar. Prueba el modo con jugadores simulados.','error'); } }); }
function volverSala(){ const g=store.get('sala'), h=store.get('host');
  if (g && g.host && h){ soyAnfitrion=true; sala=g.cod; conectar(g.cod, ok=>{ if(!ok) return toast('No se pudo conectar.','error'); S=h.S; prev=JSON.parse(JSON.stringify(S)); render(true); publicar(); }); }
  else if (g) unirse(g.cod); }
function salaGuardada(){ const g=store.get('sala'), h=store.get('host'); if(!g) return null;
  if (g.host && !(h && Date.now()-h.t < 3*3600e3)) return null; if (!g.host && !(g.t && Date.now()-g.t < 3*3600e3)) return null; return g; }
function unirse(cod){ cod=(cod||$('u-c').value).trim().toUpperCase(); if(cod.length!==4) return toast('El código tiene 4 letras.','error');
  soyAnfitrion=false; sala=cod; conectar(cod, ok=>{ if(!ok) return toast('No se pudo conectar a la sala.','error'); store.set('sala',{cod,host:false,t:Date.now()}); enviar({t:'unirse',id:miId,nombre:perfil.nombre}); red('esperando al Profeta…'); toast('Conectado. Entrando a la sala '+cod+'…'); }); }
function salirSala(){ store.set('sala',null); store.set('host',null); location.href=location.pathname; }

// Si la página se abrió desde un sticker NFC (?nfc=N): volver a la sala y registrar el toque
// Al abrir la página desde un sticker NFC (?nfc=N)
if (nfcURL) try{ history.replaceState(null,'',location.pathname); }catch(e){}   // se limpia la dirección: así el aviso no vuelve a salir al recargar
const gIni = salaGuardada();
if (nfcURL){
  if (perfil && gIni && !gIni.host){ vista='inicio'; unirse(gIni.cod); toast('Leyendo NFC '+nfcURL+'…');
    const iv=setInterval(()=>{ if(S && S.fase==='camino'){ accion({k:'nfc',n:nfcURL}); clearInterval(iv); } },1200); setTimeout(()=>clearInterval(iv),60000); }
  else if (perfil && gIni && gIni.host){ vista='inicio'; volverSala(); }
  else vista='nfcsin';
}
// Si la página se recargó o se cerró a mitad del juego, vuelve sola a la sala
else if (perfil && gIni){ vista='inicio'; volverSala(); toast('Volviendo a tu sala '+gIni.cod+'…'); }
// Si el NFC abrió una pestaña nueva (iPhone), la pestaña antigua queda en pausa para no tener varias jugando
let pausada=false;
try{ const bc=new BroadcastChannel('tupahue');
  bc.onmessage=e=>{ const d=e.data; if(d.id!==miId || d.tab===TAB) return;
    if (d.t==='hola' && !soyAnfitrion){ pausada=true; net=null; sala=null; $('app').innerHTML=`<div class="min-h-[100dvh] bg-grass px-6 flex flex-col justify-center text-center text-whitesand"><h1 class="text-3xl font-bold">El juego siguió en otra pestaña</h1><p class="mt-2">Ya puedes cerrar esta pestaña.</p></div>`; }
    if (d.t==='hola' && soyAnfitrion) bc.postMessage({t:'soyProfeta', id:miId, tab:TAB});
    if (d.t==='soyProfeta') { $('app').innerHTML=`<div class="min-h-[100dvh] bg-grass px-6 flex flex-col justify-center text-center text-whitesand"><h1 class="text-3xl font-bold">Vuelve a tu pestaña anterior</h1><p class="mt-2">Ahí está tu sala como Profeta. Cierra esta pestaña.</p></div>`; }
  };
  if (nfcURL) bc.postMessage({t:'hola', id:miId, tab:TAB});
}catch(e){}
render();
